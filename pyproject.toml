[project]
name = "fdm"
version = "0.1.0"
description = "합성 페르소나 기반 금융상품 설계·검증 에이전트 (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "altair>=5.3"]
personas = ["datasets>=2.20", "pyarrow>=16.0"]
dense = ["sentence-transformers>=3.0"]

[project.scripts]
fdm = "fdm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
